<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple E-commerce Store</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="container">
      <h1>Simple E-commerce Store</h1>
      <p>Browse products, add to cart, and place your order with Cash on Delivery.</p>
    </header>

    <main class="container layout">
      <section>
        <h2>Products</h2>
        <div id="products" class="products-grid"></div>
      </section>

      <aside class="panel">
        <h2>Shopping Cart</h2>
        <div id="cart-items"></div>
        <div class="totals">
          <p>Subtotal: <strong><span id="subtotal">0.00</span> JD</strong></p>
          <p>Delivery Fee: <strong><span id="delivery">0.00</span> JD</strong></p>
          <p>Total: <strong><span id="total">0.00</span> JD</strong></p>
        </div>
      </aside>
    </main>

    <section class="container panel checkout-section">
      <h2>Checkout</h2>
      <form id="checkout-form" class="checkout-form">
        <label>
          Full Name
          <input type="text" id="customerName" required />
        </label>
        <label>
          Email
          <input type="email" id="email" required />
        </label>
        <label>
          Phone
          <input type="tel" id="phone" required />
        </label>
        <label>
          Address
          <textarea id="address" required></textarea>
        </label>

        <p class="payment">Payment Method: <strong>Cash on Delivery (COD)</strong></p>

        <div>
          <h3>Order Summary</h3>
          <div id="order-summary"></div>
        </div>

        <button type="submit">Place Order</button>
      </form>

      <p id="status-message" class="status-message"></p>
    </section>

    <script src="script.js"></script>
  </body>
</html>
